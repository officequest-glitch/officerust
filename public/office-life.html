r:#53d7ff}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#122643cc,#0a172a99);padding:20px}.mission{position:relative;overflow:hidden;min-height:226px;transition:.25s}.mission:hover{transform:translateY(-5px);border-color:#53d7ff66}.mission.active{border-color:#f6c453aa;box-shadow:0 0 30px #f6c45318}.mission.locked{filter:saturate(.35);opacity:.58}.mission::after{content:'';position:absolute;right:-35px;top:-45px;width:140px;height:140px;border-radius:50%;background:#53d7ff12}.stars{color:var(--gold);letter-spacing:3px}.progress{height:8px;border-radius:99px;background:#0a1629;overflow:hidden}.progress>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#ffefaa)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;padding:13px 18px;border-radius:99px;background:#12243e;border:1px solid #53d7ff66;box-shadow:0 10px 40px #0008}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  function onboarding(){return `<section class="onboarding" aria-label="Welcome to OfficeQuest"><div class="onboarding-card glass"><div class="welcome-mark">✦</div><div class="eyebrow">OFFICEQUEST · PRODISTIK EDITION</div><h1 style="font-size:clamp(30px,6vw,52px);margin:10px 0">Welcome to OfficeQuest!</h1><p class="muted" style="line-height:1.6;max-width:480px;margin:0 auto 24px">Buat karakter profesionalmu dan mulai misi kantor yang seru.</p><label for="player-name" style="display:block;text-align:left;font-weight:800;margin-bottom:8px">Nama Panggilan</label><input id="player-name" maxlength="24" autocomplete="nickname" placeholder="Masukkan Nama Panggilanmu..." value="${state.draftName}" oninput="this.closest('.onboarding-card').querySelector('button.primary').disabled=!this.value.trim();state.draftName=this.value"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;text-align:left"><b>Pilih Avatar</b><span class="muted" style="font-size:12px">Klik salah satu</span></div><div class="avatar-grid">${playerAvatars.map((avatar,i)=>`<button type="button" class="avatar-choice ${state.draftAvatar===avatar.id?'selected':''}" aria-label="${avatar.label}" onclick="chooseAvatar('${avatar.id}')"><span class="avatar-art">${avatar.art}</span><small class="muted">Agent ${i+1}</small><small style="display:block;font-size:10px;color:var(--gold);margin-top:3px">${avatar.label}</small></button>`).join('')}</div><button type="button" class="btn primary" style="width:100%;padding:14px" onclick="startAdventure()" ${state.draftName.trim()?'':'disabled'}>Mulai Petualangan ➔</button></div></section>`}

  function startAdventure(){const input=document.querySelector('#player-name');const name=(input?.value||state.draftName||'').trim();if(!name){toast('Isi nama panggilan terlebih dahulu.');return}state.name=name;state.draftName=name;state.avatar=state.draftAvatar;localStorage.setItem('officeQuest_playerName',name);localStorage.setItem('officeQuest_playerAvatar',state.avatar);state.screen='map';render();document.querySelector('.onboarding')?.animate([{opacity:1},{opacity:0}],{duration:350,easing:'ease-out'});ding()}
function editProfile(){state.name='';state.draftName='';state.draftAvatar=state.avatar;render()}
function side(){const items=[['map','🗺️','Peta Misi'],['leaderboard','🏆','Papan Peringkat'],['shop','🛍️','Toko Avatar & Item'],['achievements','🎖️','Achievement & Badge'],['certificate','📜','Sertifikat Kelulusan'],['profile','📊','Analisis Statistik']];return `<aside class="sidebar" style="position:fixed;inset:0 auto 0 0;width:255px;padding:22px 14px;z-index:3"><div style="padding:5px 12px 25px"><div style="font-weight:900;font-size:23px">OFFICE<span style="color:var(--gold)">QUEST</span></div><div class="eyebrow" style="margin-top:6px">PRODISTIK EDITION</div></div><div class="side-nav">${items.map(x=>`<button class="nav-btn ${state.screen===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="icon">${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div><div class="card" style="margin-top:28px;padding:14px"><div class="eyebrow">SEASON 01</div><div class="muted" style="font-size:12px;margin-top:6px">Misi kantor untuk calon profesional.</div><div class="progress" style="margin-top:12px"><i style="width:${state.unlocked.filter(Boolean).length/8*100}%"></i></div></div></aside>`}
function top(){return `<header class="glass topbar" style="border-radius:20px;padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:space-between"><div style="display:flex;gap:13px;align-items:center"><div style="width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#f59e0b);color:#07101f;display:grid;place-items:center;font-weight:900;font-size:22px">${avatarVisual(state.avatar)}</div><div><div class="eyebrow">PLAYER PROFILE</div><b style="font-size:18px">${playerName()}</b><div class="muted" style="font-size:12px">Level ${Math.min(8,state.day)} · Junior Office Admin</div><div class="progress" style="width:180px;margin-top:6px"><i style="width:${Math.min(100,40+state.score)}%"></i></div></div></div><div class="stats" style="display:flex;gap:8px;align-items:center"><div class="stat"><small class="muted">COINS</small><br><b style="color:var(--gold)">${state.coins}</b></div><div class="stat"><small class="muted">ENERGY</small><br><b style="color:var(--cyan)">100/100</b></div><div class="stat"><small class="muted">XP</small><br><b style="color:var(--green)">${Math.max(0,Number(state.score)||0)}</b></div><button class="btn" onclick="state.sound=!state.sound;render()">${state.sound?'🔊':'🔇'} ${state.sound?'Sound':'Muted'}</button></div></header>`}
function mobileNav(){const items=[['map','🗺️','Misi'],['leaderboard','🏆','Ranking'],['shop','🛍️','Toko'],['certificate','📜','Sertifikat'],['profile','👤','Profil']];return `<nav class="mobile-bottom-nav" aria-label="Navigasi utama mobile">${items.map(x=>`<button class="${state.screen===x[0]?'active':''}" onclick="go('${x[0]}')" aria-label="${x[2]}"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('')}</nav>`}
function dashboard(){return `<div class="layout" style="display:block"><div>${side()}</div><main class="main" style="margin-left:255px;padding:25px 32px;max-width:1500px"><div class="content-container">${top()}<div style="margin-top:24px">${state.screen==='map'?map():state.screen==='leaderboard'?leaderboard():state.screen==='shop'?shop():state.screen==='achievements'?achievements():state.screen==='certificate'?certificate():profile()}</div></div></main>${mobileNav()}</div>`}
function go(s){state.screen=s;render()}
function map(){return `<div style="display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap"><div><div class="eyebrow">MISSION CONTROL · WORLD MAP</div><h1 style="font-size:42px;line-height:1.05;margin:8px 0">Peta Misi</h1><p class="muted">Jelajahi 8 zona kantor. Setiap misi punya materi, mini-game, dan kuis unik.</p></div><button class="btn" onclick="unlockAll()">⚡ Dev Mode: Unlock All Levels</button></div><div class="mission-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:25px">${missions.map((m,i)=>{const open=state.unlocked[i];const status=i<state.day-1?'SELESAI':open?'AKTIF':'TERKUNCI';return `<button ${open?`onclick="selectDay(${i+1})"`:''} ${open?'':'disabled'} class="card mission ${open?'active':'locked'}" style="text-align:left"><div style="display:flex;justify-content:space-between;align-items:start"><span style="font-size:34px">${open?m[2]:'🔒'}</span><span class="eyebrow" style="color:${status==='SELESAI'?'var(--green)':status==='AKTIF'?'var(--gold)':'#71829a'}">${status}</span></div><div class="muted" style="font-size:11px;letter-spacing:.14em;margin-top:20px">DAY ${String(i+1).padStart(2,'0')}</div><h2 style="margin:7px 0 4px;font-size:19px">${m[0]}</h2><div style="color:var(--cyan);font-size:12px">${m[1]}</div><div class="stars" style="margin-top:18px">${i<state.day-1?'★ ★ ★':'☆ ☆ ☆'}</div><div class="muted" style="font-size:12px;margin-top:9px">⏱ 8 min &nbsp; · &nbsp; +60 XP &nbsp; · &nbsp; +20 coins</div></button>`}).join('')}</div>`}
 function leaderboard(){const players=[{name:'Alya Prameswari',xp:1240,badge:'🏆'},{name:'Bima Ramadhan',xp:1080,badge:'🔥'},{name:'Dina Kartika',xp:920,badge:'🎖️'},{name:'Fajar Nugraha',xp:760,badge:'📁'},{name:playerName(),xp:playerXP(),badge:state.avatar}].sort((a,b)=>b.xp-a.xp);return page('WEEKLY RANKING','Papan Peringkat','Urutan otomatis berdasarkan XP terkini.',`<div class="card" style="margin-top:20px"><div class="muted" style="padding:0 8px 12px;font-size:12px">XP pemain disinkronkan langsung dari progres misi.</div>${players.map((player,index)=>`<div style="display:flex;align-items:center;gap:15px;padding:16px 8px;border-bottom:1px solid var(--line);${player.name==='Cyrill Aprilia'?'background:#f6c4530d;border-radius:12px':''}"><b style="color:var(--gold);width:30px">${String(index+1).padStart(2,'0')}</b><span style="font-size:25px">${player.badge}</span><b style="flex:1">${player.name}</b><span class="muted">${player.xp.toLocaleString('id-ID')} XP</span></div>`).join('')}</div>`)}
function shop(){const items=[['junior','🧑‍💼','Junior Admin','Default / Unlocked',0],['assistant','👩‍💼','Executive Assistant','Outfit profesional',150],['manager','🧑‍💻','Office Manager','Gaya pemimpin operasional',300],['master','🎓','Prodistik Master','Outfit final mission',500],['midnight','🌌','Midnight Navy','Default / Unlocked',0],['cyber','⚡','Cyberpunk Neon','Tema kontras neon',200],['cozy','🪴','Cozy Minimalist','Tema hangat',250],['hint','💡','Hint Kuis 5x','Bantuan saat kuis',50],['energy','🔋','Isi Ulang Energi +50','Pulihkan energi',40],['streak','🔥','Streak Saver','Lindungi streak',100]];return page('REWARD CENTER · '+state.coins+' COINS','Toko Avatar & Item','Upgrade identitas, tema, dan power-up.',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:20px">${items.map(x=>{const owned=state.owned.includes(x[0]);return `<article class="card"><div style="font-size:43px">${x[1]}</div><h3>${x[2]}</h3><p class="muted" style="font-size:13px">${x[3]}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><b style="color:var(--gold)">${x[4]?'💰 '+x[4]:'FREE'}</b><button class="btn ${owned?'cyan':'primary'}" ${owned?'':`onclick="buyItem('${x[0]}',${x[4]})"`}>${owned?'Dipakai':'Beli'}</button></div></article>`}).join('')}</div>`)}
function buyItem(id,cost){if(state.owned.includes(id)){toast('Item sudah dipakai.');return}if(state.coins<cost){toast('Koin Tidak Cukup! Selesaikan Misi untuk Mendapatkan Koin');return}state.coins-=cost;state.owned.push(id);ding();toast('Item berhasil dibeli dan dipakai!');render()}
function achievements(){const a=[['🚀','First Mission','Selesaikan Day 1',state.day>1],['🧠','Quiz Master','Jawab kuis dengan benar',state.score>0],['💎','Perfect Score','Dapatkan 3 bintang',state.day>2],['⌨️','Fast Typist','Tuntaskan misi digital',state.day>6]];return page('COLLECTION · 04 BADGES','Achievement & Badge','Koleksi pencapaian perjalanan Office Quest.',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px">${a.map(x=>`<article class="card" style="opacity:${x[3]?1:.48}"><div style="font-size:48px">${x[3]?x[0]:'🔒'}</div><h3>${x[1]}</h3><p class="muted" style="font-size:13px">${x[2]}</p><b style="color:${x[3]?'var(--green)':'var(--muted)'}">${x[3]?'UNLOCKED':'LOCKED'}</b></article>`).join('')}</div>`)}
function certificate(){const done=state.unlocked[7];return page('CERTIFICATION HUB','Sertifikat Kelulusan','Preview sertifikat resmi Prodistik.',`<div class="card" style="max-width:760px;margin:20px auto;text-align:center;padding:45px;border:2px solid ${done?'var(--gold)':'var(--line)'}"><div style="font-size:55px;filter:${done?'none':'grayscale(1)'}">🎓</div><div class="eyebrow" style="margin-top:15px">PRODISTIK · OFFICE QUEST</div><h2 style="font-size:30px;margin:14px 0">${done?'CERTIFICATE OF COMPLETION':'CERTIFICATE LOCKED'}</h2><p class="muted">${done?'Diberikan kepada':'Selesaikan Day 8 untuk membuka'} </p><h3 style="font-size:22px">${done?'Cyrill Aprilia Cahyani':'— — —'}</h3><p class="muted">Junior Office Admin · Season 01</p><button class="btn primary" style="margin-top:22px" ${done?'':'disabled'} onclick="toast('Sertifikat siap dicetak!')">🖨️ Download PDF / Cetak</button></div>`)}
function profile(){return page('PLAYER ANALYTICS','Analisis Statistik Belajar','Pantau kemajuan dan konsistensi latihanmu.',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:20px">${[['Misi terbuka',state.unlocked.filter(Boolean).length+'/8'],['XP terkumpul',state.score],['Kuis selesai',Math.max(0,state.day-1)],['Badge unlocked',state.unlocked[7]?'4':'2']].map(x=>`<div class="card"><div class="muted" style="font-size:12px">${x[0]}</div><b style="display:block;font-size:30px;color:var(--gold);margin-top:12px">${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:16px"><b>Progress level</b><div class="progress" style="margin-top:14px"><i style="width:${state.unlocked.filter(Boolean).length/8*100}%"></i></div><p class="muted" style="font-size:13px">${state.unlocked.filter(Boolean).length} dari 8 misi sudah tersedia.</p><button class="btn" onclick="editProfile()">✎ Edit Profil</button></div>`)}
function page(k,t,d,c){return `<div><div class="eyebrow">${k}</div><h1 style="font-size:42px;line-height:1.05;margin:8px 0">${t}</h1><p class="muted">${d}</p>${c}</div>`}
function selectDay(n){state.day=n;state.slide=0;state.quiz=0;state.answer=null;state.selected=null;state.matched=[];state.score=0;state.screen='learn';render()}
function learn(){const m=missions[state.day-1];return `<main style="max-width:850px;margin:auto"><button class="btn" onclick="go('map')">← Kembali ke Peta</button><div class="eyebrow" style="margin-top:28px">DAY ${state.day} · ${m[1]}</div><h1 style="font-size:40px;margin:8px 0">${m[0]} <span style="font-size:42px">${m[2]}</span></h1><article class="card" style="display:grid;grid-template-columns:170px 1fr;gap:25px;align-items:center;margin-top:22px"><div style="height:170px;border-radius:18px;background:radial-gradient(circle,#21446e,#09172a);display:grid;place-items:center;font-size:75px">${m[2]}</div><div><div class="eyebrow">MATERI ${state.slide+1}/3</div><h2 style="font-size:25px;margin:12px 0">${m[3][state.slide]}</h2><p class="muted" style="line-height:1.7">Pelajari prinsip ini sebelum masuk ke tantangan interaktif. Ketelitian dan komunikasi adalah kunci admin profesional.</p></div></article><div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" onclick="prevSlide()" ${state.slide===0?'disabled':''}>← Prev Slide</button><button class="btn primary" onclick="nextSlide()">${state.slide===2?'Mulai File Hunt':'Next Slide →'}</button></div></main>`}
function prevSlide(){state.slide=Math.max(0,state.slide-1);render()}function nextSlide(){if(state.slide<2)state.slide++;else state.screen='game';render()}
function game(){const m=missions[state.day-1];return `<main style="max-width:850px;margin:auto"><button class="btn" onclick="go('map')">← Peta Misi</button><div class="eyebrow" style="margin-top:28px">DAY ${state.day} · MINI-GAME</div><h1 style="font-size:38px;margin:8px 0">File Hunt: ${m[0]}</h1><div class="card" style="margin-top:18px;border-color:#f6c45366;background:#f6c4530c"><b>Cara Main:</b> 1. Klik dokumen di atas. 2. Klik folder tujuan yang sesuai di bawah.</div><section class="card" style="margin-top:16px"><div class="eyebrow">DOKUMEN</div><div style="display:grid;gap:9px;margin-top:10px">${m[4].filter(x=>!state.matched.includes(x[1])).map(x=>`<button class="btn ${state.selected===x[1]?'primary':''}" style="text-align:left" onclick="pick('${x[1]}')">📄 <b>${x[0]}</b><small class="muted"> · pilih untuk memindahkan</small></button>`).join('')}</div><div class="eyebrow" style="margin-top:25px">FOLDER TUJUAN</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">${m[5].map(x=>`<button class="btn" onclick="sort('${x[0]}',this)">📂<br><small>${x[1]}</small></button>`).join('')}</div><p style="min-height:25px;text-align:center;color:${state.feedback?.startsWith('Benar')?'var(--green)':'#ff879e'};font-weight:800;margin:18px 0">${state.feedback||'Pilih satu dokumen untuk mulai.'}</p>${state.matched.length===3?'<button id="btn-next-to-quiz" type="button" class="btn primary" style="width:100%" onclick="goToQuiz(state.day)">BERHASIL! LANJUT KE KUIS →</button>':''}</section></main>`}
function pick(type){state.selected=type;state.feedback='';render()}function sort(type,el){if(!state.selected){state.feedback='Pilih dokumen terlebih dahulu.';render();return}if(type===state.selected){state.matched.push(type);state.selected=null;state.feedback='Benar! Dokumen tersimpan di folder yang tepat.';ding();render()}else{state.feedback='Folder Tidak Sesuai';el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);render()}}
function quiz(){const m=missions[state.day-1],q=quizBank[state.day-1][state.quiz],answered=state.answer!==null,ok=answered&&state.answer===q[2];return `<main style="max-width:800px;margin:auto"><button class="btn" onclick="go('map')">← Peta Misi</button><div class="eyebrow" style="margin-top:28px">DAY ${state.day} · QUIZ CHECKPOINT</div><h1 style="font-size:38px;margin:8px 0">${m[0]}</h1><section class="card" style="margin-top:18px"><div class="muted">SOAL ${state.quiz+1} / ${quizBank[state.day-1].length}</div><h2 style="font-size:21px;line-height:1.5">${q[0]}</h2><div style="display:grid;gap:10px;margin-top:20px">${q[1].map((o,i)=>`<button class="btn" style="text-align:left;border-color:${answered&&i===q[2]?'#5ee6a8':answered&&i===state.answer?'#ff718b':'var(--line)'};background:${answered&&i===q[2]?'#5ee6a81a':answered&&i===state.answer?'#ff718b1a':'#ffffff08'}" onclick="answer(${i})"><b style="color:var(--gold)">${String.fromCharCode(65+i)}.</b> ${o}</button>`).join('')}</div>${answered?`<div class="card" style="margin-top:16px;border-color:${ok?'#5ee6a866':'#ff718b66'};color:${ok?'var(--green)':'#ffb0bd'}">${ok?'Jawaban Benar! +20 Poin':'Jawaban belum tepat. Pelajari kembali materi lalu pilih jawaban yang sesuai.'}</div>`:''}<button class="btn primary" style="width:100%;margin-top:18px" ${ok?'':'disabled'} onclick="nextQuiz()">${state.quiz===quizBank[state.day-1].length-1?'SELESAI & KEMBALI KE PETA':'LANJUT →'}</button></section></main>`}
function goToQuiz(day){state.day=day;state.screen='quiz';state.quiz=0;state.answer=null;state.feedback='';ding();render()}function answer(i){state.answer=i;if(i===quizBank[state.day-1][state.quiz][2])ding();render()}function nextQuiz(){state.score+=20;state.quiz++;state.answer=null;if(state.quiz>=quizBank[state.day-1].length){state.unlocked[Math.min(7,state.day)]=true;save();state.screen='map';toast('Misi selesai! Level berikutnya terbuka.')}render()}function unlockAll(){state.unlocked=Array(8).fill(true);save();toast('Semua level terbuka untuk Dev Mode.');render()}
Object.assign(window,{state,go,selectDay,unlockAll,toast,buyItem,pick,sort,goToQuiz,answer,nextQuiz,prevSlide,nextSlide,chooseAvatar,startAdventure,editProfile});
try{render()}catch(error){document.querySelector('#app').innerHTML='<main style="padding:40px;color:#fff;font-family:system-ui"><h1>Office Quest</h1><p>Dashboard gagal dimuat. Refresh halaman untuk mencoba lagi.</p></main>';console.error('[v0] Dashboard render error:',error)}
})();
</script></body></html>
