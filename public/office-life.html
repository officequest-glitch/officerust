<!doctype html>
<html lang="id">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:'#0F172A',slateblue:'#1E293B',gold:'#F59E0B',emerald:'#10B981'}}}}</script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#243b5b 0,#0f172a 35%,#070d18 100%);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e2e8f0;min-height:100vh}.glass{background:linear-gradient(135deg,rgba(30,41,59,.82),rgba(15,23,42,.72));border:1px solid rgba(148,163,184,.18);box-shadow:0 18px 50px rgba(0,0,0,.25);backdrop-filter:blur(16px)}.screen{display:none}.screen.active{display:block}.pulse{animation:pulse 1.8s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 0 0 15px rgba(245,158,11,0)}}.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.pop{animation:pop .35s ease-out}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}.confetti{position:fixed;width:9px;height:16px;top:-20px;z-index:60;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(620deg);opacity:0}}.progress-fill{transition:width .3s}.nav-item.active{color:#fbbf24;background:rgba(245,158,11,.12)}canvas{width:100%;height:210px;border-radius:16px;background:#111c2e}.locked{filter:grayscale(.7);opacity:.6}.choice.selected{border-color:#f59e0b;background:rgba(245,158,11,.13)}.choice.correct{border-color:#10b981;background:rgba(16,185,129,.16)}.choice.wrong{border-color:#ef4444;background:rgba(239,68,68,.16)}.file-doc{transition:transform .2s,border-color .2s,box-shadow .2s}.file-doc.selected{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.2),0 0 25px rgba(245,158,11,.35);transform:translateY(-3px)}.file-doc.completed{border-color:#10b981;background:rgba(16,185,129,.14);opacity:.7}.folder-target{transition:transform .2s,border-color .2s,background .2s}.folder-target:hover{border-color:#f59e0b;transform:translateY(-2px)}.shake{animation:shake .4s ease-in-out}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.fly-check{animation:flyCheck .7s ease-out}@keyframes flyCheck{0%{transform:scale(.5) translateY(12px);opacity:0}35%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen"></div>
  <div id="toast" class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 hidden glass rounded-full px-5 py-3 text-sm"></div>
<script>
const A={name:'',avatar:'👨‍💼',division:'Administrasi',xp:0,coins:120,level:1,day:1,items:[],muted:false};
const qs=[['Dokumen yang diterima dari luar organisasi disebut…',['Surat masuk','Surat keluar','Laporan keuangan'],'Surat masuk','Surat dari pihak luar yang diterima organisasi adalah surat masuk.'],['Tempat penyimpanan arsip aktif yang tepat adalah…',['Gudang tanpa label','Filing cabinet berindeks','Meja rapat'],'Filing cabinet berindeks','Arsip aktif perlu mudah ditemukan melalui sistem indeks.'],['Saat menerima telepon kantor, hal pertama yang dilakukan adalah…',['Diam saja','Salam dan identitas kantor','Langsung menutup'],'Salam dan identitas kantor','Etika telepon dimulai dengan salam dan menyebutkan identitas.'],['Laporan keuangan termasuk dokumen…',['Keuangan','Surat masuk','Promosi'],'Keuangan','Laporan keuangan disimpan pada klasifikasi keuangan.'],['Surat yang dikirim organisasi untuk pihak luar disebut…',['Surat masuk','Surat keluar','Arsip pribadi'],'Surat keluar','Surat yang dikirim keluar organisasi adalah surat keluar.']];
let screen='home',quizIndex=0,quizScore=0,sortScore=0,sortTime=45,sortTimer=null,videoPlaying=false,videoProgress=0,selectedQuiz=null,lessonSlide=0,selectedDoc=null,sortFeedback='',sortFeedbackType='';
const items=[['🌿','Tanaman Hias',60],['💡','Lampu Meja',80],['🪑','Kursi Ergonomis',150],['🗄️','Filing Cabinet',120],['🖼️','Poster Motivasi',45]];
function iconButton(label,fn){return `<button onclick="${fn}" class="text-slate-300 hover:text-amber-300 transition" aria-label="${label}">${label}</button>`}
function render(){document.getElementById('app').innerHTML=screen==='home'?home():screen==='create'?create():screen==='mentor'?mentor():shell();}
function home(){return `<main class="min-h-screen flex items-center justify-center p-6"><section class="w-full max-w-5xl grid lg:grid-cols-2 gap-8 items-center"><div class="text-center lg:text-left"><div class="inline-flex items-center gap-2 glass rounded-full px-4 py-2 text-xs text-amber-300 mb-6">✦ PRODISTIK EDITION · SEASON 01</div><h1 class="text-6xl md:text-8xl font-black tracking-tight text-white">Office<br><span class="text-amber-400">Quest</span></h1><p class="text-slate-400 mt-5 max-w-md text-lg">Temukan bakat administrasimu. Selesaikan misi, kuasai skill, dan jadilah legenda kantor.</p><div class="flex flex-wrap gap-3 mt-8 justify-center lg:justify-start"><button onclick="go('mentor')" class="pulse bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl">MULAI &gt;&gt;</button><button onclick="settings()" class="glass px-5 py-4 rounded-2xl">⚙ Pengaturan</button><button onclick="credits()" class="glass px-5 py-4 rounded-2xl">✦ Credit</button></div></div><div class="glass rounded-[2rem] p-5 rotate-2 max-w-md mx-auto w-full"><div class="rounded-3xl bg-gradient-to-br from-slate-800 to-slate-950 p-7 relative overflow-hidden"><div class="absolute -right-10 -top-10 text-[130px] opacity-10">🏢</div><div class="flex justify-between items-center mb-10"><span class="text-xs text-emerald-300">● SYSTEM ONLINE</span><span class="text-xs text-slate-500">v1.0.8</span></div><div class="text-center float"><div class="text-8xl">${A.avatar}</div><div class="mt-4 font-bold text-xl">Your next chapter<br><span class="text-amber-400">starts here.</span></div></div><div class="mt-10 grid grid-cols-3 gap-2 text-center text-xs"><div class="bg-white/5 rounded-xl p-3"><b class="block text-amber-300 text-lg">8</b>Days</div><div class="bg-white/5 rounded-xl p-3"><b class="block text-emerald-300 text-lg">5</b>Quizzes</div><div class="bg-white/5 rounded-xl p-3"><b class="block text-sky-300 text-lg">∞</b>Skills</div></div></div></div></section></main>`}
function create(){return `<main class="min-h-screen flex items-center justify-center p-6"><section class="glass rounded-3xl p-7 w-full max-w-xl pop"><div class="flex justify-between mb-7"><div><p class="text-amber-400 text-sm font-bold">STEP 3 / 16</p><h2 class="text-3xl font-black mt-1">Buat Karaktermu</h2></div><span class="text-5xl">🪪</span></div><label class="text-sm text-slate-400">Nama panggilan</label><input id="name" value="${A.name}" placeholder="contoh: Rani" class="w-full mt-2 mb-6 bg-slate-950/60 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-amber-400"/><label class="text-sm text-slate-400">Pilih avatar</label><div class="grid grid-cols-2 gap-3 mt-2 mb-6">${[['👨‍💼','Laki-laki'],['👩‍💼','Perempuan']].map(x=>`<button onclick="pickAvatar('${x[0]}')" class="choice ${A.avatar===x[0]?'selected':''} border border-slate-700 rounded-xl p-4 text-left"><span class="text-3xl">${x[0]}</span><span class="block text-sm mt-2">${x[1]}</span></button>`).join('')}</div><label class="text-sm text-slate-400">Divisi pilihan</label><select id="division" class="w-full mt-2 bg-slate-950/60 border border-slate-700 rounded-xl px-4 py-3"><option>Administrasi</option><option>Keuangan</option><option>Hubungan Publik</option><option>Teknologi Informasi</option></select><button onclick="saveCharacter()" class="w-full mt-7 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-xl">MASUK KE KANTOR →</button></section></main>`}
function mentor(){return `<main class="min-h-screen flex items-center justify-center p-6"><section class="glass rounded-3xl p-8 max-w-lg text-center pop"><div class="text-8xl float">🧑‍🏫</div><p class="text-amber-400 text-sm font-bold mt-5">MENTOR MIRA · ONBOARDING</p><h2 class="text-3xl font-black mt-2">Selamat datang, calon profesional!</h2><p class="text-slate-400 leading-relaxed mt-4">Kantor kita sedang membutuhkanmu. Ada file penting yang hilang. Siap belajar, menjelajah, dan memecahkan misteri pertama?</p><button onclick="go('create')" class="mt-7 bg-amber-500 text-slate-950 font-black px-7 py-3 rounded-xl">SIAP, MENTOR! →</button></section></main>`}
function shell(){return `<div class="md:grid md:grid-cols-[235px_1fr] min-h-screen"><aside class="hidden md:flex flex-col border-r border-white/10 p-5 gap-2"><div class="font-black text-xl px-3 py-5 text-white">Office<span class="text-amber-400">Quest</span><div class="text-[10px] text-slate-500 tracking-widest">PRODISTIK EDITION</div></div>${nav()}</aside><main class="pb-24 md:pb-8"><header class="sticky top-0 z-20 px-5 md:px-8 py-4 bg-[#0f172a]/85 backdrop-blur border-b border-white/10 flex justify-between items-center"><div><p class="text-xs text-slate-500">GOOD MORNING,</p><h2 class="font-bold text-white">${A.name||'Agent'} ${A.avatar}</h2></div><div class="flex items-center gap-2 text-xs"><span class="glass px-3 py-2 rounded-xl text-amber-300">⚡ ${A.xp} XP</span><span class="glass px-3 py-2 rounded-xl text-yellow-300">🪙 ${A.coins}</span><button onclick="settings()" class="glass p-2 rounded-xl">⚙</button></div></header><div class="max-w-6xl mx-auto p-5 md:p-8">${screen==='hub'?hub():screen==='map'?map():screen==='learning'?learning():screen==='filehunt'?filehunt():screen==='quiz'?quiz():screen==='shop'?shop():screen==='desk'?desk():screen==='collection'?collection():screen==='badges'?badges():screen==='daily'?daily():screen==='library'?library():''}</div></main><nav class="fixed bottom-0 left-0 right-0 z-30 md:hidden glass p-2 grid grid-cols-5">${mobileNav()}</nav></div>`}
function nav(){return [['hub','⌂','Dashboard'],['map','◈','Peta Misi'],['shop','♜','Toko Kantor'],['desk','▣','Meja Kerja'],['collection','▤','Koleksi'],['badges','✦','Badge Room']].map(n=>`<button onclick="go('${n[0]}')" class="nav-item ${screen===n[0]?'active':''} rounded-xl px-3 py-3 text-left text-sm flex gap-3">${n[1]} ${n[2]}</button>`).join('')}
function mobileNav(){return [['hub','⌂'],['map','◈'],['shop','♜'],['desk','▣'],['collection','▤']].map(n=>`<button onclick="go('${n[0]}')" class="nav-item ${screen===n[0]?'active':''} rounded-xl py-2 text-center text-xl">${n[1]}<span class="block text-[9px]">${n[0]}</span></button>`).join('')}
function hub(){return `<section class="flex justify-between items-end mb-7"><div><p class="text-emerald-300 text-sm font-bold">MONDAY · DAY ${A.day}</p><h1 class="text-4xl md:text-5xl font-black text-white mt-2">Your Office Hub</h1><p class="text-slate-400 mt-2">Setiap hari adalah kesempatan untuk naik level.</p></div><div class="hidden sm:block text-6xl">🌱</div></section><div class="grid lg:grid-cols-[1.4fr_1fr] gap-5"><article class="glass rounded-3xl p-6 bg-gradient-to-br from-amber-500/15 to-transparent"><div class="flex justify-between"><div><span class="text-xs text-amber-300 font-bold">CURRENT MISSION</span><h2 class="text-2xl font-black mt-2">The Missing File</h2><p class="text-slate-400 mt-2 max-w-md">Bantu Mentor Mira menemukan dokumen penting yang terselip di ruang arsip.</p></div><span class="text-5xl">📁</span></div><button onclick="go('map')" class="mt-7 bg-amber-500 text-slate-950 font-bold px-5 py-3 rounded-xl">LANJUTKAN MISI →</button></article><article class="glass rounded-3xl p-6"><div class="flex justify-between"><h3 class="font-bold">Daily Progress</h3><span class="text-emerald-300 text-sm">${Math.min(A.xp,100)}%</span></div><div class="h-2 bg-slate-800 rounded-full mt-4"><div class="h-2 bg-emerald-400 rounded-full" style="width:${Math.min(A.xp,100)}%"></div></div><div class="grid grid-cols-2 gap-3 mt-6 text-sm"><button onclick="go('daily')" class="bg-white/5 rounded-xl p-3 text-left">🎯 Daily Mission<br><span class="text-slate-500 text-xs">+30 XP</span></button><button onclick="go('library')" class="bg-white/5 rounded-xl p-3 text-left">🎬 Video Library<br><span class="text-slate-500 text-xs">3 lessons</span></button></div></article></div><section class="mt-7"><h2 class="font-bold text-xl mb-4">Quick Access</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-3">${[['filehunt','🗂️','File Hunt'],['quiz','🧠','Kuis Skill'],['shop','🛒','Toko Kantor'],['badges','🏆','Badge Room']].map(x=>`<button onclick="go('${x[0]}')" class="glass rounded-2xl p-5 text-left hover:-translate-y-1 transition"><span class="text-3xl">${x[1]}</span><b class="block mt-3">${x[2]}</b><small class="text-slate-500">Explore now →</small></button>`).join('')}</div></section>`}
function map(){return `<div class="flex justify-between items-end mb-7"><div><p class="text-amber-300 text-sm font-bold">STORY MODE · 16 STEPS</p><h1 class="text-4xl font-black mt-2">Mission Map</h1></div><span class="text-slate-500 text-sm">${A.day}/8 days</span></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${Array.from({length:8},(_,i)=>{let open=i===0;return `<button ${open?'onclick="go(\'learning\')"':''} class="${open?'':'locked'} glass rounded-2xl p-5 text-left relative"><div class="flex justify-between"><span class="text-2xl">${open?'📂':'🔒'}</span><span class="text-xs text-slate-500">DAY ${i+1}</span></div><h3 class="font-bold mt-5">${['The Missing File','Phone Protocol','Paper Trail','Finance Files','Client First','Digital Desk','Office Ethics','Prodistik Pro'][i]}</h3><p class="text-xs text-slate-500 mt-2">${open?'AVAILABLE NOW':'Complete previous day'}</p>${open?'<span class="absolute top-4 right-4 text-emerald-300 text-xs">●</span>':''}</button>`}).join('')}</div>`}
function learning(){const slides=[{eyebrow:'01 · DASAR',title:'Kelompokkan dokumen',copy:'Kelompokkan dokumen berdasarkan JENIS dan TANGGAL agar mudah ditemukan.',tip:'Gunakan label yang konsisten: Surat Masuk, Surat Keluar, dan Keuangan.',visual:`<svg viewBox="0 0 280 190" role="img" aria-label="Ilustrasi folder arsip" class="w-full h-full"><rect x="38" y="52" width="204" height="112" rx="14" fill="#f59e0b"/><path d="M38 62V42a12 12 0 0 1 12-12h64l20 20h96a12 12 0 0 1 12 12v12H38Z" fill="#fbbf24"/><rect x="62" y="88" width="156" height="10" rx="5" fill="#0f172a" opacity=".35"/><rect x="62" y="112" width="112" height="10" rx="5" fill="#0f172a" opacity=".25"/><circle cx="211" cy="139" r="22" fill="#10b981"/><path d="m200 139 7 7 15-17" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`},{eyebrow:'02 · SISTEM',title:'Urutkan berdasarkan tanggal',copy:'Simpan dokumen terbaru di bagian depan agar informasi penting selalu siap digunakan.',tip:'Tambahkan tahun dan bulan pada nama folder untuk pencarian yang lebih cepat.',visual:`<svg viewBox="0 0 280 190" role="img" aria-label="Ilustrasi kalender kantor" class="w-full h-full"><rect x="48" y="30" width="184" height="138" rx="16" fill="#e2e8f0"/><rect x="48" y="30" width="184" height="42" rx="16" fill="#38bdf8"/><path d="M83 20v26M197 20v26" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/><g fill="#64748b"><circle cx="84" cy="98" r="8"/><circle cx="124" cy="98" r="8"/><circle cx="164" cy="98" r="8"/><circle cx="204" cy="98" r="8"/><circle cx="84" cy="132" r="8"/><circle cx="124" cy="132" r="8"/><circle cx="164" cy="132" r="8"/></g><circle cx="204" cy="132" r="13" fill="#10b981"/><path d="m198 132 5 5 9-11" fill="none" stroke="white" stroke-width="4"/></svg>`},{eyebrow:'03 · KEBIASAAN BAIK',title:'Rawat arsip setiap hari',copy:'Kearsipan yang baik membuat pekerjaan lebih cepat, aman, dan profesional.',tip:'Luangkan lima menit di akhir hari untuk mengembalikan file ke tempatnya.',visual:`<svg viewBox="0 0 280 190" role="img" aria-label="Ilustrasi filing cabinet" class="w-full h-full"><rect x="72" y="26" width="136" height="142" rx="12" fill="#64748b"/><rect x="88" y="44" width="104" height="30" rx="7" fill="#1e293b"/><rect x="88" y="82" width="104" height="30" rx="7" fill="#1e293b"/><rect x="88" y="120" width="104" height="30" rx="7" fill="#1e293b"/><g fill="#fbbf24"><rect x="132" y="56" width="18" height="6" rx="3"/><rect x="132" y="94" width="18" height="6" rx="3"/><rect x="132" y="132" width="18" height="6" rx="3"/></g><path d="M48 160h184" stroke="#10b981" stroke-width="8" stroke-linecap="round"/></svg>`}];const s=slides[lessonSlide];return `<div class="max-w-3xl mx-auto"><p class="text-amber-300 text-sm font-bold">STEP 6 · LEARNING ROOM</p><h1 class="text-4xl font-black mt-2">Tata Kearsipan</h1><p class="text-slate-400 mt-2 mb-5">Baca tiga kartu materi sebelum masuk ruang File Hunt.</p><div class="glass rounded-3xl p-4 md:p-5"><div class="rounded-2xl overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 border border-white/10 min-h-[390px] grid md:grid-cols-[.9fr_1.1fr] items-center"><div class="p-7 order-2 md:order-1"><span class="inline-flex rounded-full bg-amber-400/15 text-amber-300 px-3 py-1 text-xs font-bold tracking-wide">${s.eyebrow}</span><h2 class="text-3xl font-black text-white mt-5 leading-tight">${s.title}</h2><p class="text-slate-300 text-lg leading-relaxed mt-4">${s.copy}</p><div class="mt-5 rounded-xl bg-emerald-400/10 border border-emerald-400/20 p-4 text-sm text-emerald-200"><b>INSIGHT</b><br>${s.tip}</div></div><div class="h-56 md:h-full p-8 flex items-center justify-center bg-white/[.03] order-1 md:order-2">${s.visual}</div></div><div class="flex items-center justify-between gap-3 mt-5"><button onclick="prevLesson()" ${lessonSlide===0?'disabled':''} class="glass disabled:opacity-30 px-4 py-3 rounded-xl font-bold">← Prev Slide</button><span class="text-xs text-slate-400">SLIDE ${lessonSlide+1} / ${slides.length}</span><button onclick="nextLesson()" ${lessonSlide===slides.length-1?'disabled':''} class="bg-amber-500 disabled:opacity-30 text-slate-950 px-4 py-3 rounded-xl font-bold">Next Slide →</button></div><div class="flex gap-2 justify-center mt-4">${slides.map((_,i)=>`<button onclick="jumpLesson(${i})" aria-label="Ke slide ${i+1}" class="h-2 rounded-full transition-all ${i===lessonSlide?'w-8 bg-amber-400':'w-2 bg-slate-600'}"></button>`).join('')}</div></div><button onclick="go('filehunt')" ${lessonSlide<slides.length-1?'disabled':''} class="w-full mt-5 bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-black py-4 rounded-xl">${lessonSlide<slides.length-1?'BACA SEMUA SLIDE UNTUK MULAI':'MULAI FILE HUNT →'}</button></div>`}
function filehunt(){const docs=[['✉️','Surat_Masuk_Vendor.docx','masuk'],['📊','Laporan_Keuangan_2024.xlsx','keuangan'],['📤','Surat_Keluar_Izin.pdf','keluar']];const folders=[['masuk','📥','SURAT MASUK','Dokumen dari pihak luar'],['keuangan','💰','KEUANGAN','Laporan dan angka'],['keluar','📤','SURAT KELUAR','Dokumen yang dikirim']];return `<div class="max-w-3xl mx-auto"><div class="flex justify-between"><div><p class="text-amber-300 text-sm font-bold">STEP 9 · MINI-GAME (FILE HUNT)</p><h1 class="text-4xl font-black mt-2">File Hunt</h1></div><div class="text-right"><span class="text-rose-300 font-black text-2xl">00:${String(sortTime).padStart(2,'0')}</span><small class="block text-slate-500">TIMER</small></div></div><div class="mt-4 rounded-2xl border border-amber-400/30 bg-amber-500/10 p-4 text-amber-100"><b>Cara Main:</b> 1. Klik/Pilih dokumen yang ada di atas. 2. Klik folder tujuan yang sesuai di bawah!</div><div class="glass rounded-3xl p-6 mt-5"><p class="text-xs font-bold tracking-widest text-slate-500 mb-3">PILIH DOKUMEN</p><div class="grid gap-3 mb-8">${docs.map(d=>`<button ${sortScore>=3?'disabled':''} onclick="selectDoc('${d[2]}')" class="file-doc ${selectedDoc===d[2]?'selected':''} ${sortScore>docs.findIndex(x=>x[2]===d[2])?'completed':''} glass rounded-2xl p-4 flex items-center gap-4 text-left"><span class="text-3xl">${d[0]}</span><span><b class="block text-sm text-white">${d[1]}</b><small class="text-slate-400">${d[2].toUpperCase()} · klik untuk memilih</small></span><span class="ml-auto text-emerald-300 text-xl">${sortScore>docs.findIndex(x=>x[2]===d[2])?'✔':''}</span></button>`).join('')}</div><p class="text-xs font-bold tracking-widest text-slate-500 mb-3">PILIH FOLDER TUJUAN</p><div class="grid md:grid-cols-3 gap-3">${folders.map(f=>`<button onclick="sortDoc('${f[0]}')" class="folder-target border border-dashed border-slate-600 rounded-2xl p-4 text-center"><span class="text-3xl">${f[1]}</span><b class="block text-xs mt-2">${f[2]}</b><small class="block text-[10px] text-slate-500 mt-1">${f[3]}</small></button>`).join('')}</div>${sortFeedback?`<div class="${sortFeedbackType==='wrong'?'text-rose-300 bg-rose-500/10':'text-emerald-300 bg-emerald-500/10'} mt-5 rounded-xl p-3 text-center font-bold">${sortFeedback}</div>`:''}<p class="text-center text-emerald-300 mt-6 font-bold">Correct files: ${sortScore}/3</p>${sortScore===3?'<button onclick="go(\'quiz\')" class="w-full mt-5 bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">MULAI QUIZ →</button>':''}</div></div>`}
function quiz(){let q=qs[quizIndex];return `<div class="max-w-2xl mx-auto"><p class="text-amber-300 text-sm font-bold">STEP 10 · KNOWLEDGE CHECK</p><div class="flex justify-between items-end"><h1 class="text-4xl font-black mt-2">Kuis Skill</h1><span class="text-slate-500">${quizIndex+1} / 5</span></div><div class="h-2 bg-slate-800 rounded-full mt-5"><div class="h-2 bg-amber-400 rounded-full" style="width:${(quizIndex+1)*20}%"></div></div><div class="glass rounded-3xl p-6 mt-6"><p class="text-xl font-bold leading-relaxed">${q[0]}</p><div class="grid gap-3 mt-6">${q[1].map((a,i)=>`<button onclick="answer(${i})" class="choice ${selectedQuiz===i?'selected':''} border border-slate-700 rounded-xl p-4 text-left">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div>${selectedQuiz!==null?`<div class="mt-5 p-4 rounded-xl ${q[1][selectedQuiz]===q[2]?'bg-emerald-500/15 text-emerald-300':'bg-rose-500/15 text-rose-300'}"><b>${q[1][selectedQuiz]===q[2]?'✓ Benar!':'✕ Belum tepat'}</b><p class="text-sm mt-1 text-slate-300">${q[3]}</p></div>`:''}<button ${selectedQuiz===null?'disabled':''} onclick="nextQuiz()" class="w-full mt-6 bg-amber-500 disabled:opacity-40 text-slate-950 font-black py-3 rounded-xl">${quizIndex===4?'SELESAI & KLAIM HADIAH':'LANJUT →'}</button></div></div>`}
function shop(){return `<div class="flex justify-between items-end mb-7"><div><p class="text-amber-300 text-sm font-bold">OFFICE MARKET</p><h1 class="text-4xl font-black mt-2">Toko Kantor</h1></div><span class="text-yellow-300">🪙 ${A.coins}</span></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${items.map((x,i)=>`<article class="glass rounded-2xl p-5"><div class="text-6xl text-center py-5">${x[0]}</div><h3 class="font-bold">${x[1]}</h3><div class="flex justify-between items-center mt-4"><span class="text-amber-300">🪙 ${x[2]}</span><button onclick="buy(${i})" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg">BELI</button></div></article>`).join('')}</div>`}
function desk(){return `<div class="mb-7"><p class="text-amber-300 text-sm font-bold">CUSTOMIZATION</p><h1 class="text-4xl font-black mt-2">Meja Kerja</h1><p class="text-slate-400 mt-2">Barang yang kamu beli otomatis menghiasi meja.</p></div><div class="glass rounded-3xl p-8 min-h-[380px] flex items-end justify-center"><div class="relative w-full max-w-xl"><div class="absolute -top-20 left-1/2 -translate-x-1/2 text-8xl">${A.avatar}</div><div class="h-4 bg-amber-800 rounded-lg"></div><div class="h-28 bg-gradient-to-b from-amber-900 to-amber-950 rounded-b-xl border-x-8 border-amber-950 relative"><div class="absolute inset-x-8 top-5 flex justify-center gap-5 text-4xl">${A.items.map(i=>items[i][0]).join('')||'🖥️ 📝'}</div></div><div class="flex justify-between px-12"><div class="w-4 h-28 bg-amber-950"></div><div class="w-4 h-28 bg-amber-950"></div></div></div></div>`}
function collection(){return `<h1 class="text-4xl font-black mb-7">Collection</h1><div class="grid sm:grid-cols-2 gap-4"><button onclick="go('library')" class="glass rounded-2xl p-6 text-left"><span class="text-4xl">🎬</span><h2 class="font-bold mt-4">Video Library</h2><p class="text-slate-500 text-sm">3 lesson interaktif</p></button><button onclick="go('badges')" class="glass rounded-2xl p-6 text-left"><span class="text-4xl">🏆</span><h2 class="font-bold mt-4">Badge Room</h2><p class="text-slate-500 text-sm">${A.xp>=100?'1 badge unlocked':'Locked badges waiting'}</p></button></div>`}
function badges(){return `<h1 class="text-4xl font-black mb-7">Badge Room</h1><div class="glass rounded-3xl p-8 text-center max-w-md"><div class="text-8xl ${A.xp>=100?'':'grayscale opacity-40'}">🕵️</div><h2 class="text-2xl font-black mt-5">File Detective</h2><p class="text-slate-400 mt-2">${A.xp>=100?'Unlocked · You found the missing file!':'Complete the mission to unlock'}</p></div><button onclick="printReport()" class="mt-6 glass px-5 py-3 rounded-xl">🖨 Cetak Rapor Kinerja</button>`}
function daily(){return `<h1 class="text-4xl font-black mb-7">Daily Mission</h1><div class="glass rounded-2xl p-6 max-w-xl"><div class="flex justify-between"><div><span class="text-emerald-300 text-xs font-bold">TODAY'S CHALLENGE</span><h2 class="text-2xl font-bold mt-2">Master of Organization</h2><p class="text-slate-400 mt-2">Selesaikan File Hunt tanpa salah.</p></div><span class="text-4xl">🎯</span></div><div class="mt-6 h-2 bg-slate-800 rounded-full"><div class="h-2 bg-emerald-400 rounded-full" style="width:${sortScore*33}%"></div></div><p class="text-xs text-slate-500 mt-2">${sortScore}/3 progress · Reward +30 XP</p></div>`}
function library(){return `<h1 class="text-4xl font-black mb-7">Video Library</h1><div class="grid gap-3">${[['📁','Tata Kearsipan','12 min'],['☎','Etika Telepon','8 min'],['✉','Surat Menyurat','10 min']].map(x=>`<button onclick="go('learning')" class="glass rounded-2xl p-5 flex items-center gap-4 text-left"><span class="text-4xl">${x[0]}</span><span><b>${x[1]}</b><small class="block text-slate-500">Interactive lesson · ${x[2]}</small></span><span class="ml-auto text-amber-300">▶</span></button>`).join('')}</div>`}
function go(s){screen=s; if(s==='filehunt')startTimer(); if(s==='learning')setTimeout(drawCanvas,30); render(); sound(520,.06);}
function pickAvatar(x){A.avatar=x;render()}function saveCharacter(){A.name=document.getElementById('name').value.trim()||'Alya';A.division=document.getElementById('division').value;go('hub');}
function settings(){modal(`<h2 class="text-2xl font-black">Pengaturan</h2><label class="flex justify-between mt-6"><span>Background music</span><input type="checkbox" ${A.muted?'':'checked'} onchange="A.muted=!this.checked;closeModal()"></label><button onclick="closeModal()" class="mt-6 w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl">Simpan</button>`)}function credits(){modal(`<h2 class="text-2xl font-black">Office Quest</h2><p class="text-slate-400 mt-3">Dibuat untuk pembelajaran Prodistik dengan semangat bermain dan bertumbuh.</p><button onclick="closeModal()" class="mt-6 bg-amber-500 text-slate-950 px-5 py-3 rounded-xl">Tutup</button>`)}
function modal(html){let m=document.createElement('div');m.id='modal';m.className='fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-5';m.innerHTML=`<div class="glass rounded-3xl p-7 max-w-sm w-full pop">${html}</div>`;document.body.append(m)}function closeModal(){document.getElementById('modal')?.remove()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function sound(freq,dur=.12){if(A.muted)return;let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}
function startTimer(){clearInterval(sortTimer);sortTime=45;sortScore=0;selectedDoc=null;sortFeedback='';sortFeedbackType='';sortTimer=setInterval(()=>{sortTime--;if(sortTime<=0){clearInterval(sortTimer);toast('Waktu habis! Coba lagi.')}},1000)}function selectDoc(type){if(sortScore>=3)return;selectedDoc=type;sortFeedback='';sortFeedbackType='';sound(620,.06);render()}function sortDoc(type){if(!selectedDoc){sortFeedback='Pilih dokumen terlebih dahulu.';sortFeedbackType='wrong';sound(180);render();return}if(type===selectedDoc){sortScore++;sortFeedback='✔ Ding! Dokumen meluncur ke folder yang benar.';sortFeedbackType='correct';sound(880);selectedDoc=null;if(sortScore===3){clearInterval(sortTimer);A.xp+=30;sortFeedback='✔ Semua dokumen tersimpan dengan benar!';toast('File Hunt selesai! +30 XP')}}else{sortFeedback='✖ Folder Salah! Coba lagi';sortFeedbackType='wrong';sound(180);document.querySelector('.folder-target')?.classList.add('shake');setTimeout(()=>document.querySelector('.folder-target')?.classList.remove('shake'),450)}render()}
function answer(i){selectedQuiz=i;sound(qs[quizIndex][1][i]===qs[quizIndex][2]?880:180);render()}function nextQuiz(){if(qs[quizIndex][1][selectedQuiz]===qs[quizIndex][2])quizScore++;if(quizIndex===4){A.xp+=100;A.coins+=50;confetti();modal(`<div class="text-center"><div class="text-7xl">🏆</div><p class="text-amber-300 font-bold mt-4">MISSION COMPLETE</p><h2 class="text-3xl font-black mt-2">Level Up!</h2><p class="text-slate-400 mt-3">+100 XP · +50 Coins</p><div class="mt-4 bg-amber-500/15 text-amber-300 rounded-xl p-4">Badge unlocked: File Detective</div><button onclick="closeModal();go('hub')" class="w-full mt-5 bg-amber-500 text-slate-950 font-black py-3 rounded-xl">KEMBALI KE HUB</button></div>`)}else{quizIndex++;selectedQuiz=null;render()}}function buy(i){if(A.coins<items[i][2])return toast('Koin belum cukup.');A.coins-=items[i][2];A.items.push(i);sound(1040);toast(items[i][1]+' terpasang di meja!');render()}function confetti(){for(let i=0;i<70;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#f59e0b','#10b981','#38bdf8','#f43f5e'][i%4];e.style.animationDelay=Math.random()*.7+'s';document.body.append(e);setTimeout(()=>e.remove(),2800)}sound(1200,.3)}
function printReport(){modal(`<h2 class="text-2xl font-black">Rapor Kinerja</h2><div class="bg-slate-950/50 rounded-xl p-4 mt-5 space-y-2 text-sm"><p>Nama: <b>${A.name}</b></p><p>Divisi: <b>${A.division}</b></p><p>XP: <b>${A.xp}</b></p><p>Skor Kuis: <b>${quizScore}/5</b></p><p>Status: <b class="text-emerald-300">Junior Office Specialist</b></p></div><button onclick="window.print()" class="mt-5 w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl">Print sekarang</button>`)}
function drawCanvas(){let c=document.getElementById('lessonCanvas');if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);let slide=Math.floor(videoProgress/34);x.fillStyle='#16243a';x.fillRect(0,0,w,h);x.fillStyle='#f59e0b';x.font='bold 28px system-ui';x.fillText(['THE MISSING FILE','ETIKA TELEPON','SURAT MENYURAT'][slide]||'TATA KEARSIPAN',50,70);x.fillStyle='#cbd5e1';x.font='22px system-ui';x.fillText(['Arsip rapi, kerja lebih cepat.','Sapa dengan ramah dan profesional.','Tulis nomor, tanggal, dan tujuan.'][slide]||'',50,120);x.strokeStyle='#10b981';x.lineWidth=8;x.strokeRect(50,170,260,120);x.fillStyle='#10b981';x.font='70px serif';x.fillText(['🗄️','☎','✉'][slide]||'📁',145,255);x.fillStyle='#334155';x.fillRect(400,185,380,18);x.fillRect(400,225,290,18);x.fillRect(400,265,340,18);if(videoPlaying){videoProgress=Math.min(100,videoProgress+.55);render();setTimeout(drawCanvas,80)}}function toggleVideo(){videoPlaying=!videoPlaying;drawCanvas();render()}function prevLesson(){lessonSlide=Math.max(0,lessonSlide-1);sound(420,.05);render()}function nextLesson(){lessonSlide=Math.min(2,lessonSlide+1);sound(720,.05);render()}function jumpLesson(i){lessonSlide=i;sound(600,.05);render()}
render();
</script></body></html>
