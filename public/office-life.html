<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Quest: Prodistik Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#243b5b,#0f172a 42%,#070d18);font-family:Inter,system-ui,sans-serif;color:#e2e8f0}.glass{background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.2);box-shadow:0 16px 40px #0005;backdrop-filter:blur(14px)}.locked{opacity:.45;filter:grayscale(1)}.selected{border-color:#f59e0b!important;box-shadow:0 0 0 3px #f59e0b44}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}button{cursor:pointer}button:disabled{cursor:not-allowed}
</style>
</head>
<body><div id="app"></div><div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden glass rounded-full px-5 py-3 z-50"></div>
<script>
'use strict';
const missions=[
{title:'The Missing File',focus:'Tata Kearsipan',icon:'📁',slides:[['KLASIFIKASI','Kelompokkan dokumen berdasarkan jenis dan tanggal agar mudah ditemukan.'],['LABEL','Gunakan nama folder dan label yang konsisten untuk arsip aktif.'],['PRAKTIK','Kembalikan setiap file ke folder asal setelah digunakan.']],docs:[['Surat_Masuk_Vendor.docx','masuk'],['Laporan_Keuangan_2024.xlsx','keuangan'],['Surat_Keluar_Izin.pdf','keluar']],folders:[['masuk','SURAT MASUK'],['keuangan','KEUANGAN'],['keluar','SURAT KELUAR']]},
{title:'Phone Protocol',focus:'Etika Bertelepon Kantor',icon:'☎️',slides:[['SALAM','Angkat maksimal dering ketiga dan sebutkan salam, nama, serta identitas kantor.'],['DENGARKAN','Catat kebutuhan klien tanpa memotong pembicaraan.'],['PENUTUP','Ulangi tindak lanjut dan ucapkan terima kasih sebelum menutup telepon.']],docs:[['Catatan_Panggilan_Klien.docx','catatan'],['Daftar_Kontak_Vendor.xlsx','kontak'],['Jadwal_Callback_Klien.pdf','jadwal']],folders:[['catatan','CATATAN TELEPON'],['kontak','KONTAK'],['jadwal','CALLBACK']]},
{title:'Paper Trail',focus:'Surat Menyurat Resmi',icon:'✉️',slides:[['KOP SURAT','Kop surat memuat nama, alamat, dan kontak resmi organisasi.'],['NOMOR','Nomor dan tanggal surat membantu pelacakan dokumen.'],['SALAM','Gunakan salam pembuka, isi jelas, dan salam penutup yang sopan.']],docs:[['Surat_Permohonan_Resmi.docx','resmi'],['Register_Nomor_Surat.xlsx','register'],['Surat_Undangan_Rapat.pdf','undangan']],folders:[['resmi','SURAT RESMI'],['register','REGISTER'],['undangan','UNDANGAN']]},
{title:'Finance Files',focus:'Dokumen Keuangan & Nota',icon:'🧾',slides:[['BUKTI','Nota harus memuat tanggal, pihak, nominal, dan tujuan transaksi.'],['VALIDASI','Bandingkan angka pada nota dengan catatan pembayaran.'],['AKSES','Batasi dokumen keuangan hanya untuk petugas berwenang.']],docs:[['Nota_Pembelian_ATK.jpg','nota'],['Laporan_Kas_Bulanan.xlsx','laporan'],['Bukti_Pembayaran_Vendor.pdf','bukti']],folders:[['nota','NOTA'],['laporan','LAPORAN KAS'],['bukti','BUKTI BAYAR']]},
{title:'Client First',focus:'Pelayanan Tamu / Front Office',icon:'🤝',slides:[['SAMBUT','Senyum, berdiri, dan tanyakan nama serta keperluan tamu.'],['ARAHKAN','Hubungi orang yang dituju dan tawarkan ruang tunggu.'],['CATAT','Isi buku tamu dengan identitas, tujuan, dan waktu kunjungan.']],docs:[['Buku_Tamu_Harian.xlsx','tamu'],['Form_Akses_Pengunjung.docx','akses'],['Jadwal_Kunjungan_Klien.pdf','kunjungan']],folders:[['tamu','BUKU TAMU'],['akses','AKSES'],['kunjungan','KUNJUNGAN']]},
{title:'Digital Desk',focus:'Pengelolaan Email & File Digital',icon:'🖥️',slides:[['SUBJEK','Tulis subjek email yang singkat dan spesifik.'],['LAMPIRAN','Cek penerima, nama file, dan lampiran sebelum mengirim.'],['FOLDER','Gunakan folder tahun dan proyek; jangan penuhi desktop.']],docs:[['Draft_Email_Penawaran.eml','email'],['Proposal_Proyek_2024.pdf','proyek'],['Panduan_Nama_File.docx','panduan']],folders:[['email','EMAIL'],['proyek','PROYEK'],['panduan','PANDUAN']]},
{title:'Data Defender',focus:'Keamanan Data & Kerahasiaan',icon:'🔐',slides:[['KLASIFIKASI','Data pribadi dan dokumen internal tidak boleh dibagikan sembarangan.'],['AKSES','Gunakan password kuat dan kunci layar saat meninggalkan meja.'],['INSIDEN','Jangan meneruskan file mencurigakan; laporkan kepada admin.']],docs:[['Data_Pribadi_Karyawan.xlsx','rahasia'],['Kebijakan_Akses_Internal.pdf','kebijakan'],['Laporan_Insiden_Data.docx','insiden']],folders:[['rahasia','DATA RAHASIA'],['kebijakan','KEBIJAKAN'],['insiden','INSIDEN']]},
{title:'Prodistik Pro',focus:'Ujian Komprehensif',icon:'🏆',slides:[['INTEGRASI','Arsip, surat, telepon, tamu, keuangan, dan digital saling mendukung.'],['PRIORITAS','Dahulukan akurasi, kerahasiaan, komunikasi, dan pencatatan.'],['FINAL','Cek ulang pekerjaan dan minta bantuan bila menemukan risiko.']],docs:[['Arsip_Misi_Final.zip','arsip'],['Checklist_Administrasi_Final.xlsx','checklist'],['Sertifikat_Prodistik_Pro.pdf','sertifikat']],folders:[['arsip','ARSIP FINAL'],['checklist','CHECKLIST'],['sertifikat','SERTIFIKAT']]}
];
const state={screen:'home',day:1,slide:0,quiz:0,answer:null,selected:null,score:0,matched:[],feedback:'',unlocked:loadUnlocks()};
function loadUnlocks(){try{const x=JSON.parse(localStorage.getItem('officeQuestMissionState'));if(Array.isArray(x)&&x.length===8)return x.map(Boolean)}catch(e){}return [true,false,false,false,false,false,false,false]}
function saveUnlocks(){try{localStorage.setItem('officeQuestMissionState',JSON.stringify(state.unlocked))}catch(e){}}
function render(){const a=document.getElementById('app');a.innerHTML=state.screen==='home'?home():state.screen==='map'?map():state.screen==='learn'?learn():state.screen==='game'?game():state.screen==='quiz'?quiz():shell();}
function home(){return `<main class="min-h-screen flex items-center justify-center p-6"><section class="glass rounded-3xl p-10 max-w-xl text-center"><div class="text-7xl">🏢</div><p class="text-amber-300 font-bold mt-5">PRODISTIK EDITION · SEASON 01</p><h1 class="text-6xl font-black text-white mt-3">Office <span class="text-amber-400">Quest</span></h1><p class="text-slate-400 mt-4">Belajar administrasi kantor melalui misi interaktif Day 1 sampai Day 8.</p><button onclick="state.screen='map';render()" class="mt-8 bg-amber-500 text-slate-950 font-black px-8 py-4 rounded-xl">BUKA PETA MISI →</button></section></main>`}
function shell(){return `<main class="max-w-6xl mx-auto p-5 md:p-10"><header class="flex justify-between items-center mb-10"><button onclick="state.screen='map';render()" class="font-black text-xl">Office<span class="text-amber-400">Quest</span></button><span class="text-sm text-slate-400">DAY ${state.day}/8</span></header>${state.screen==='map'?map():''}</main>`}
function map(){return `<main class="max-w-6xl mx-auto p-5 md:p-10"><div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><p class="text-amber-300 text-sm font-bold">MISSION MAP · 8 LEVEL</p><h1 class="text-4xl font-black mt-2">Peta Misi</h1><p class="text-slate-400 mt-2">Setiap level memiliki materi, mini-game, dan kuis unik.</p></div><button onclick="unlockAll()" class="glass rounded-lg px-3 py-2 text-xs font-bold text-amber-300">Buka Semua Level (Dev Mode)</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${missions.map((m,i)=>{const open=state.unlocked[i];return `<button ${open?`onclick="selectDay(${i+1})"`:''} ${open?'':'disabled'} class="${open?'':'locked'} glass rounded-2xl p-5 text-left"><span class="text-3xl">${open?m.icon:'🔒'}</span><p class="text-xs text-slate-500 mt-4">DAY ${i+1}</p><h2 class="font-bold mt-1">${m.title}</h2><p class="text-xs text-amber-300 mt-2">${m.focus}</p></button>`}).join('')}</div></main>`}
function selectDay(day){state.day=day;state.slide=0;state.score=0;state.matched=[];state.selected=null;state.feedback='';state.screen='learn';render()}
function learn(){const m=missions[state.day-1],s=m.slides[state.slide];return `<main class="max-w-4xl mx-auto p-5 md:p-10"><div class="flex justify-between"><div><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · ${m.focus}</p><h1 class="text-4xl font-black mt-2">${m.title}</h1></div><span class="text-6xl">${m.icon}</span></div><article class="glass rounded-3xl mt-7 p-7 grid md:grid-cols-2 gap-6 items-center"><div class="rounded-2xl bg-slate-950/70 min-h-56 flex items-center justify-center text-8xl">${m.icon}</div><div><p class="text-amber-300 text-xs font-bold">${s[0]} · MATERI ${state.slide+1}/3</p><h2 class="text-2xl font-black mt-3">${s[1]}</h2><p class="text-slate-300 leading-relaxed mt-4">${s[1]}</p><p class="text-emerald-300 text-sm mt-5">Fokus: ${m.focus}</p></div></article><div class="flex justify-between gap-3 mt-5"><button onclick="prevSlide()" class="glass px-5 py-3 rounded-xl" ${state.slide===0?'disabled':''}>← Prev Slide</button><button onclick="nextSlide()" class="bg-amber-500 text-slate-950 font-bold px-5 py-3 rounded-xl">${state.slide===2?'Selesai Materi':'Next Slide →'}</button></div></main>`}
function prevSlide(){state.slide=Math.max(0,state.slide-1);render()}function nextSlide(){if(state.slide<2){state.slide++;render()}else{state.screen='game';render()}}
function game(){const m=missions[state.day-1];return `<main class="max-w-3xl mx-auto p-5 md:p-10"><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · MINI-GAME</p><h1 class="text-4xl font-black mt-2">File Hunt: ${m.title}</h1><div class="mt-5 rounded-2xl border border-amber-400/30 bg-amber-500/10 p-4"><b>Cara Main:</b> 1. Klik/Pilih dokumen yang ada di atas. 2. Klik folder tujuan yang sesuai di bawah!</div><section class="glass rounded-3xl p-6 mt-5"><p class="text-xs font-bold text-slate-500 mb-3">PILIH DOKUMEN</p><div class="grid gap-3">${m.docs.filter(d=>!state.matched.includes(d[1])).map(d=>`<button type="button" onclick="pickDoc('${d[1]}')" class="glass rounded-xl p-4 text-left transition-transform hover:-translate-y-1 ${state.selected===d[1]?'selected':''}"><b class="text-white">📄 ${d[0]}</b><small class="block text-slate-400 mt-1">Jenis: ${d[1]}</small></button>`).join('')}</div><p class="text-xs font-bold text-slate-500 mt-7 mb-3">PILIH FOLDER TUJUAN</p><div class="grid md:grid-cols-3 gap-3">${m.folders.map(f=>`<button type="button" onclick="sortDoc('${f[0]}',this)" class="folder folder-${f[0]} glass rounded-xl p-4 transition-transform hover:-translate-y-1"><span class="text-2xl">📂</span><b class="block mt-2">${f[1]}</b></button>`).join('')}</div><p id="feedback" class="mt-5 text-center font-bold min-h-6 ${state.feedback.startsWith('Benar')?'text-emerald-300':'text-rose-300'}">${state.feedback}</p>${state.score===3?'<button type="button" onclick="state.screen=\'quiz\';state.quiz=0;state.answer=null;render()" class="w-full bg-emerald-500 text-slate-950 font-black py-4 rounded-xl">BERHASIL! LANJUT KE KUIS →</button>':''}</section></main>`}
function pickDoc(type){if(!state.matched.includes(type)){state.selected=type;state.feedback='';render()}}
function playDing(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}
function sortDoc(type,button){if(!state.selected){state.feedback='Pilih dokumen terlebih dahulu.';render();return}if(type===state.selected){state.matched.push(state.selected);state.score=state.matched.length;state.selected=null;state.feedback='Benar! Dokumen masuk ke folder yang tepat.';playDing();render()}else{state.feedback='Folder Tidak Sesuai';button.classList.remove('shake');void button.offsetWidth;button.classList.add('shake');setTimeout(()=>button.classList.remove('shake'),400);render()}}
function quiz(){const m=missions[state.day-1],s=m.slides[state.quiz];const choices=['Terapkan sesuai prosedur','Abaikan agar cepat','Bagikan tanpa izin'];return `<main class="max-w-2xl mx-auto p-5 md:p-10"><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · KUIS ${m.focus}</p><h1 class="text-4xl font-black mt-2">${m.title}</h1><section class="glass rounded-3xl p-6 mt-6"><h2 class="text-xl font-bold">Dalam topik ${s[0]}, tindakan yang tepat adalah?</h2><div class="grid gap-3 mt-6">${choices.map((c,i)=>`<button onclick="answerQuiz(${i})" class="glass rounded-xl p-4 text-left ${state.answer===i?'selected':''}">${c}</button>`).join('')}</div><button ${state.answer===null?'disabled':''} onclick="nextQuiz()" class="w-full mt-6 bg-amber-500 disabled:opacity-40 text-slate-950 font-black py-3 rounded-xl">${state.quiz===2?'SELESAI & BUKA DAY BERIKUTNYA':'LANJUT →'}</button></section></main>`}
function answerQuiz(i){state.answer=i;render()}function nextQuiz(){if(state.answer===0){state.quiz++;state.answer=null;if(state.quiz>2){state.unlocked[Math.min(7,state.day)]=true;saveUnlocks();state.screen='map';toast('Misi selesai. Level berikutnya terbuka!')}render()}else{toast('Jawaban belum tepat. Terapkan prosedur yang dipelajari.')}}
function unlockAll(){state.unlocked=Array(8).fill(true);saveUnlocks();toast('Semua level terbuka untuk Dev Mode.');render()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
render();
</script></body></html>
