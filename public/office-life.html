const state={screen:'home',day:1,slide:0,quiz:0,answer:null,selected:null,score:0,matched:[],feedback:'',unlocked:loadUnlocks()};
function loadUnlocks(){try{const x=JSON.parse(localStorage.getItem('officeQuestMissionState'));if(Array.isArray(x)&&x.length===8)return x.map(Boolean)}catch(e){}return [true,false,false,false,false,false,false,false]}
function saveUnlocks(){try{localStorage.setItem('officeQuestMissionState',JSON.stringify(state.unlocked))}catch(e){}}
function render(){const a=document.getElementById('app');a.innerHTML=state.screen==='home'?home():['learn','game','quiz'].includes(state.screen)?shell():dashboard();}
function home(){return `<main class="min-h-screen flex items-center justify-center p-6"><section class="glass rounded-3xl p-10 max-w-xl text-center"><div class="text-7xl">🏢</div><p class="text-amber-300 font-bold mt-5">PRODISTIK EDITION · SEASON 01</p><h1 class="text-6xl font-black text-white mt-3">Office <span class="text-amber-400">Quest</span></h1><p class="text-slate-400 mt-4">Belajar administrasi kantor melalui misi interaktif Day 1 sampai Day 8.</p><button onclick="state.screen='map';render()" class="mt-8 bg-amber-500 text-slate-950 font-black px-8 py-4 rounded-xl">BUKA PETA MISI →</button></section></main>`}
function shell(){return `<main class="max-w-4xl mx-auto p-5 md:p-10"><header class="flex justify-between items-center mb-8"><button onclick="state.screen='map';render()" class="font-black text-xl">Office<span class="text-amber-400">Quest</span></button><span class="text-sm text-slate-400">DAY ${state.day}/8</span></header>${state.screen==='learn'?learn():state.screen==='game'?game():quiz()}</main>`}
function nav(active){const items=[['map','🗺️','Peta Misi'],['leaderboard','🏆','Papan Peringkat'],['shop','🛍️','Toko'],['certificate','🎓','Sertifikat'],['profile','👤','Profil & Statistik']];return `<nav class="glass rounded-2xl p-2 flex flex-wrap gap-2">${items.map(([id,icon,label])=>`<button onclick="state.screen='${id}';render()" class="flex-1 min-w-[145px] rounded-xl px-3 py-3 text-sm font-bold ${active===id?'bg-amber-500 text-slate-950':'text-slate-300 hover:bg-white/10'}"><span class="mr-2">${icon}</span>${label}</button>`).join('')}</nav>`}
function dashboard(){const active=state.screen==='map'||!['leaderboard','shop','certificate','profile'].includes(state.screen)?'map':state.screen;return `<main class="min-h-screen max-w-7xl mx-auto p-4 md:p-8"><header class="glass rounded-3xl p-5 md:p-6 mb-5"><div class="flex flex-wrap gap-5 items-center justify-between"><div class="flex items-center gap-4"><div class="h-14 w-14 rounded-2xl bg-amber-500 text-slate-950 grid place-items-center text-2xl font-black">C</div><div><p class="text-xs text-amber-300 font-bold">PRODISTIK PLAYER</p><h1 class="text-2xl font-black text-white">Cyrill <span class="text-sm text-amber-300">· Junior Admin</span></h1><p class="text-xs text-slate-400">Level ${Math.min(8,Math.max(1,state.day))} · ${state.unlocked.filter(Boolean).length}/8 misi terbuka</p></div></div><div class="flex flex-wrap gap-3"><div class="rounded-xl bg-slate-950/60 px-4 py-3"><p class="text-xs text-slate-500">XP</p><b class="text-amber-300">${state.score} XP</b></div><div class="rounded-xl bg-slate-950/60 px-4 py-3"><p class="text-xs text-slate-500">KOIN</p><b class="text-emerald-300">${Math.floor(state.score/10)+120}</b></div><div class="rounded-xl bg-slate-950/60 px-4 py-3"><p class="text-xs text-slate-500">ENERGI</p><b class="text-sky-300">100 / 100</b></div><button onclick="toggleSound(this)" class="glass rounded-xl px-4 py-3 text-sm font-bold" aria-label="Toggle sound">🔊 Sound On</button></div></div></header>${nav(active)}<section class="mt-6">${active==='map'?mapContent():active==='leaderboard'?leaderboard():active==='shop'?shop():active==='certificate'?certificate():profile()}</section></main>`}
function mapContent(){return `<div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><p class="text-amber-300 text-sm font-bold">MISSION MAP · 8 LEVEL</p><h2 class="text-4xl font-black mt-2">Peta Misi</h2><p class="text-slate-400 mt-2">Setiap level memiliki materi, mini-game, dan kuis unik.</p></div><button onclick="unlockAll()" class="glass rounded-lg px-3 py-2 text-xs font-bold text-amber-300">Buka Semua Level (Dev Mode)</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${missions.map((m,i)=>{const open=state.unlocked[i];return `<button ${open?`onclick="selectDay(${i+1})"`:''} ${open?'':'disabled'} class="${open?'':'locked'} glass rounded-2xl p-5 text-left"><span class="text-3xl">${open?m.icon:'🔒'}</span><p class="text-xs text-slate-500 mt-4">DAY ${i+1}</p><h2 class="font-bold mt-1">${m.title}</h2><p class="text-xs text-amber-300 mt-2">${m.focus}</p></button>`}).join('')}</div>`}
function leaderboard(){return `<div class="glass rounded-3xl p-6"><p class="text-amber-300 text-sm font-bold">WEEKLY RANKING</p><h2 class="text-4xl font-black mt-2">Papan Peringkat</h2><div class="mt-6 space-y-3">${[['01','Alya','980 XP'],['02','Bima','840 XP'],['03','Cyrill',state.score+' XP'],['04','Dina','620 XP']].map((r,i)=>`<div class="flex items-center gap-4 rounded-xl ${r[1]==='Cyrill'?'bg-amber-500/15 border border-amber-400/40':'bg-slate-950/40'} p-4"><b class="text-amber-300">${r[0]}</b><span class="flex-1 font-bold">${r[1]}</span><span class="text-slate-400">${r[2]}</span>${i===0?'🏆':''}</div>`).join('')}</div></div>`}
function shop(){return `<div><p class="text-amber-300 text-sm font-bold">REWARD CENTER · 120 COINS</p><h2 class="text-4xl font-black mt-2">Toko</h2><div class="grid sm:grid-cols-3 gap-4 mt-6">${[['🧑‍💼','Avatar Profesional','80 koin'],['🌌','Tema Neon Office','150 koin'],['🏅','Badge Arsip Master','200 koin']].map(x=>`<article class="glass rounded-2xl p-5"><div class="text-5xl">${x[0]}</div><h3 class="font-bold mt-4">${x[1]}</h3><p class="text-amber-300 text-sm mt-2">${x[2]}</p><button onclick="toast('Item ditambahkan ke koleksi!')" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 rounded-lg py-2 text-sm font-bold">Lihat Item</button></article>`).join('')}</div></div>`}
function certificate(){const done=state.unlocked[7];return `<div class="glass rounded-3xl p-8 text-center"><p class="text-amber-300 text-sm font-bold">CERTIFICATION HUB</p><h2 class="text-4xl font-black mt-2">Sertifikat Kelulusan</h2><div class="mt-8 border-2 ${done?'border-amber-400':'border-slate-700'} rounded-2xl p-8">${done?`<div class="text-6xl">🎓</div><h3 class="text-2xl font-black text-amber-300 mt-4">Prodistik Pro Graduate</h3><p class="text-slate-400 mt-2">Cyrill · Office Quest Season 01</p><button onclick="toast('Sertifikat siap diunduh!')" class="mt-6 bg-amber-500 text-slate-950 font-bold px-5 py-3 rounded-xl">Unduh Sertifikat</button>`:`<div class="text-6xl grayscale">🔒</div><h3 class="text-xl font-bold mt-4">Selesaikan Day 8 untuk membuka sertifikat</h3><p class="text-slate-400 mt-2">Teruskan perjalananmu di Peta Misi.</p>`}</div></div>`}
function profile(){return `<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><p class="text-amber-300 text-sm font-bold">PLAYER PROFILE</p><h2 class="text-4xl font-black mt-2">Cyrill</h2><p class="text-slate-400 mt-2">Junior Admin · Season 01</p><div class="mt-6"><div class="flex justify-between text-sm"><span>Progress misi</span><b>${state.unlocked.filter(Boolean).length}/8</b></div><div class="h-3 bg-slate-800 rounded-full mt-2 overflow-hidden"><div class="h-full bg-amber-400" style="width:${state.unlocked.filter(Boolean).length/8*100}%"></div></div></div></div><div class="glass rounded-3xl p-6"><p class="text-amber-300 text-sm font-bold">STATISTIK</p><div class="grid grid-cols-2 gap-3 mt-5">${[['Misi terbuka',state.unlocked.filter(Boolean).length],['XP terkumpul',state.score],['Kuis selesai',0],['Badge',state.unlocked[7]?1:0]].map(x=>`<div class="bg-slate-950/50 rounded-xl p-4"><p class="text-xs text-slate-500">${x[0]}</p><b class="text-xl text-white">${x[1]}</b></div>`).join('')}</div></div></div>`}
function toggleSound(btn){btn.textContent=btn.textContent.includes('On')?'🔇 Sound Off':'🔊 Sound On';toast(btn.textContent)}
function selectDay(day){state.day=day;state.slide=0;state.score=0;state.matched=[];state.selected=null;state.feedback='';state.screen='learn';render()}
function learn(){const m=missions[state.day-1],s=m.slides[state.slide];return `<main class="max-w-4xl mx-auto p-5 md:p-10"><div class="flex justify-between"><div><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · ${m.focus}</p><h1 class="text-4xl font-black mt-2">${m.title}</h1></div><span class="text-6xl">${m.icon}</span></div><article class="glass rounded-3xl mt-7 p-7 grid md:grid-cols-2 gap-6 items-center"><div class="rounded-2xl bg-slate-950/70 min-h-56 flex items-center justify-center text-8xl">${m.icon}</div><div><p class="text-amber-300 text-xs font-bold">${s[0]} · MATERI ${state.slide+1}/3</p><h2 class="text-2xl font-black mt-3">${s[1]}</h2><p class="text-slate-300 leading-relaxed mt-4">${s[1]}</p><p class="text-emerald-300 text-sm mt-5">Fokus: ${m.focus}</p></div></article><div class="flex justify-between gap-3 mt-5"><button onclick="prevSlide()" class="glass px-5 py-3 rounded-xl" ${state.slide===0?'disabled':''}>← Prev Slide</button><button onclick="nextSlide()" class="bg-amber-500 text-slate-950 font-bold px-5 py-3 rounded-xl">${state.slide===2?'Selesai Materi':'Next Slide →'}</button></div></main>`}
function prevSlide(){state.slide=Math.max(0,state.slide-1);render()}function nextSlide(){if(state.slide<2){state.slide++;render()}else{state.screen='game';render()}}
function game(){const m=missions[state.day-1];return `<main class="max-w-3xl mx-auto p-5 md:p-10"><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · MINI-GAME</p><h1 class="text-4xl font-black mt-2">File Hunt: ${m.title}</h1><div class="mt-5 rounded-2xl border border-amber-400/30 bg-amber-500/10 p-4"><b>Cara Main:</b> 1. Klik/Pilih dokumen yang ada di atas. 2. Klik folder tujuan yang sesuai di bawah!</div><section class="glass rounded-3xl p-6 mt-5"><p class="text-xs font-bold text-slate-500 mb-3">PILIH DOKUMEN</p><div class="grid gap-3">${m.docs.filter(d=>!state.matched.includes(d[1])).map(d=>`<button type="button" onclick="pickDoc('${d[1]}')" class="glass rounded-xl p-4 text-left transition-transform hover:-translate-y-1 ${state.selected===d[1]?'selected':''}"><b class="text-white">📄 ${d[0]}</b><small class="block text-slate-400 mt-1">Jenis: ${d[1]}</small></button>`).join('')}</div><p class="text-xs font-bold text-slate-500 mt-7 mb-3">PILIH FOLDER TUJUAN</p><div class="grid md:grid-cols-3 gap-3">${m.folders.map(f=>`<button type="button" onclick="sortDoc('${f[0]}',this)" class="folder folder-${f[0]} glass rounded-xl p-4 transition-transform hover:-translate-y-1"><span class="text-2xl">📂</span><b class="block mt-2">${f[1]}</b></button>`).join('')}</div><p id="feedback" class="mt-5 text-center font-bold min-h-6 ${state.feedback.startsWith('Benar')?'text-emerald-300':'text-rose-300'}">${state.feedback}</p>${state.score===3?'<button type="button" onclick="state.screen=\'quiz\';state.quiz=0;state.answer=null;render()" class="w-full bg-emerald-500 text-slate-950 font-black py-4 rounded-xl">BERHASIL! LANJUT KE KUIS →</button>':''}</section></main>`}
function pickDoc(type){if(!state.matched.includes(type)){state.selected=type;state.feedback='';render()}}
function playDing(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}
function sortDoc(type,button){if(!state.selected){state.feedback='Pilih dokumen terlebih dahulu.';render();return}if(type===state.selected){state.matched.push(state.selected);state.score=state.matched.length;state.selected=null;state.feedback='Benar! Dokumen masuk ke folder yang tepat.';playDing();render()}else{state.feedback='Folder Tidak Sesuai';button.classList.remove('shake');void button.offsetWidth;button.classList.add('shake');setTimeout(()=>button.classList.remove('shake'),400);render()}}
function quiz(){const m=missions[state.day-1],q=quizBank[state.day-1][state.quiz];const answered=state.answer!==null;const isCorrect=answered&&state.answer===q.correctIndex;return `<main class="max-w-2xl mx-auto p-5 md:p-10"><p class="text-amber-300 text-sm font-bold">DAY ${state.day} · KUIS ${m.focus}</p><h1 class="text-4xl font-black mt-2">${m.title}</h1><section class="glass rounded-3xl p-6 mt-6"><p class="text-xs text-slate-500 font-bold">SOAL ${state.quiz+1} DARI ${quizBank[state.day-1].length}</p><h2 class="text-xl font-bold leading-relaxed mt-3">${q.q}</h2><div class="grid gap-3 mt-6">${q.o.map((c,i)=>{const selected=state.answer===i;const correct=answered&&i===q.correctIndex;const wrong=selected&&!isCorrect;return `<button type="button" onclick="answerQuiz(${i})" class="glass rounded-xl p-4 text-left transition ${correct?'bg-emerald-500/25 border-emerald-400 text-emerald-100':wrong?'bg-rose-500/25 border-rose-400 text-rose-100':selected?'selected':''}"><span class="${correct?'text-emerald-300':wrong?'text-rose-300':'text-amber-300'} font-black mr-2">${correct?'✓':wrong?'✕':String.fromCharCode(65+i)+'.'}</span>${c}</button>`}).join('')}</div>${answered?`<div class="mt-5 rounded-xl border ${isCorrect?'border-emerald-400/40 bg-emerald-500/10 text-emerald-200':'border-rose-400/40 bg-rose-500/10 text-rose-200'} p-4 font-bold">${isCorrect?'Jawaban Benar! +20 Poin':'Jawaban belum tepat. '+q.explanation}</div>`:''}<button type="button" ${!isCorrect?'disabled':''} onclick="nextQuiz()" class="w-full mt-6 bg-amber-500 disabled:opacity-40 text-slate-950 font-black py-3 rounded-xl">${state.quiz===quizBank[state.day-1].length-1?'SELESAI & BUKA DAY BERIKUTNYA':'LANJUT →'}</button></section></main>`}
function answerQuiz(i){const q=quizBank[state.day-1][state.quiz];state.answer=i;state.feedback=i===q.correctIndex?'Jawaban Benar! +20 Poin':`Jawaban belum tepat. Pilihan yang tepat adalah ${String.fromCharCode(65+q.correctIndex)}.`;if(i===q.correctIndex)playDing();render()}function nextQuiz(){const q=quizBank[state.day-1][state.quiz];if(state.answer===q.correctIndex){state.score+=20;state.quiz++;state.answer=null;state.feedback='';if(state.quiz>=quizBank[state.day-1].length){state.unlocked[Math.min(7,state.day)]=true;saveUnlocks();state.screen='map';toast('Misi selesai. Level berikutnya terbuka!')}render()}}
function unlockAll(){state.unlocked=Array(8).fill(true);saveUnlocks();toast('Semua level terbuka untuk Dev Mode.');render()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
render();
</script></body></html>
